log-level: default

telemetry:
  enabled: false
  otlp:
    endpoint: ""
    insecure: ""
    metrics:
      endpoint: ""
      insecure: ""
    traces:
      endpoint: ""
      insecure: ""

dependency-pr-status:
  update:
    dependency-update-authors:
      - dependabot
      - renovate
      - srv-gh-o11y-gdi
    stale-age: 7d

flaky-test-analysis:
  lookback: 7d

repositories:
  - url: https://github.com/owner/repository
    enabled: true
    # local-path: /Users/name/dev/repository
